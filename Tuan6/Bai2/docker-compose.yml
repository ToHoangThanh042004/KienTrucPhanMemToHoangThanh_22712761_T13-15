version: '3.8'

services:
  # Dịch vụ Database (Postgres)
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    volumes:
      # QUAN TRỌNG: Lưu data vào volume 'pgdata'. 
      # Khi xóa container, data vẫn nằm ở đây.
      - pgdata:/var/lib/postgresql/data 
    ports:
      - "5432:5432"

  # Dịch vụ Ứng dụng (Node.js)
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Kết nối tới db thông qua tên service 'db'
      DATABASE_URL: postgres://myuser:mypassword@db:5432/mydatabase
    depends_on:
      - db

volumes:
  # Khai báo volume để Docker quản lý độc lập
  pgdata: